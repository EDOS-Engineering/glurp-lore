AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  lore.orkmeter.com: CloudFront, the ACM certificate and the deploy role
  (us-east-1, EDOS-Labs) in front of the us-west-2 bucket in lore-origin.yaml. The certificate's DNS validation
  record and the lore CNAME live in the orkmeter.com zone in the management
  account. GitHub Actions on glurp-lore main syncs _site and invalidates.

Parameters:
  DomainName:
    Type: String
    Default: lore.orkmeter.com
  GitHubSubjectPrefix:
    Type: String
    Default: repo:EDOS-Engineering@155857438/glurp-lore@1446009821
    Description: >-
      The repository's immutable OIDC subject prefix (owner and repository
      with their numeric IDs), as GitHub issues it for glurp-lore.
  OriginBucketName:
    Type: String
    Default: glurp-lore-origin-bucket-rd1pajp5k8yk
    Description: The us-west-2 bucket from stack glurp-lore-origin (lore-origin.yaml).
  WithDomain:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      "false" only for the first create. ACM checks CAA along the lore CNAME,
      and github.io's CAA excludes Amazon, so the certificate can be issued
      only after lore points at CloudFront.

Conditions:
  HasDomain: !Equals [!Ref WithDomain, "true"]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Ref DomainName
        Enabled: true
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: s3
            DomainName: !Sub "${OriginBucketName}.s3.us-west-2.amazonaws.com"
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions on glurp-lore main publishes the storybook.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "${GitHubSubjectPrefix}:ref:refs/heads/main"
      Policies:
        - PolicyName: publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${OriginBucketName}"
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::${OriginBucketName}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Condition: HasDomain
    Value: !Ref Certificate
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
