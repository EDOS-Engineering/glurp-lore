name: Deploy

# Publishes the storybook to lore.orkmeter.com: S3 behind CloudFront in
# EDOS-Labs: the bucket is stack glurp-lore-origin (infra/lore-origin.yaml,
# us-west-2, the only region the organization allows for regional services);
# CloudFront, ACM and the deploy role are stack glurp-lore-site
# (infra/lore-site.yaml, us-east-1).
# The role, bucket and distribution come from repository variables set
# from that stack's outputs. No job environment: the role trusts the OIDC
# subject repo:EDOS-Engineering@155857438/glurp-lore@1446009821:ref:refs/heads/main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: sitemap lastmod comes from git log
      - name: Build the storybook
        run: python3 scripts/build_site.py --out _site && rm -f _site/CNAME
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.LORE_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - name: Upload
        env:
          BUCKET: ${{ vars.LORE_BUCKET }}
        run: |
          # Pages revalidate within five minutes; fonts, images and the rest a day.
          aws s3 sync _site "s3://$BUCKET" --delete --exclude "*.html" --cache-control "public, max-age=86400"
          aws s3 sync _site "s3://$BUCKET" --delete --exclude "*" --include "*.html" --cache-control "public, max-age=300" --content-type "text/html; charset=utf-8"
      - name: Invalidate
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.LORE_DISTRIBUTION_ID }}" --paths "/*" --query Invalidation.Id --output text
